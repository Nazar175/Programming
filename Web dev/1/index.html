<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <title>Тестова сторінка</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <h1>Привіт, світ!</h1>
        <p>Це тестова сторінка.</p>
        <a href="https://www.example.com">Перейти на приклад</a>
        <form>
            <label for="name">Ім'я:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <input type="submit" value="Надіслати">
            <table>
                <tr>
                    <th>Назва</th>
                    <th>Вік</th>
                </tr>
                <tr>
                    <td>Іван</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>Марія</td>
                    <td>30</td>
                </tr>
            </table>
            <button type="button" onclick="alert('Привіт!')">Натисни мене</button>
        </form>
    </body>
</html>
