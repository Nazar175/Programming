
name: Additional Jobs

on:
  workflow_dispatch:

jobs:
  first_job:
    name: First Job - Information
    runs-on: ubuntu-latest
    steps:
      - name: Show message
        run: echo "First job is running"

      - name: Show repository
        run: echo "Repository: Programming"

  second_job:
    name: Second Job - Calculations
    runs-on: ubuntu-latest
    steps:
      - name: Calculate numbers
        run: echo "10 + 20 = 30"

      - name: Show result
        run: echo "Calculation completed"

  third_job:
    name: Third Job - Python
    runs-on: ubuntu-latest
    steps:
      - name: Check Python
        run: python --version

      - name: Show Python message
        run: echo "Python environment is ready"

  fourth_job:
    name: Fourth Job - Final
    runs-on: ubuntu-latest
    steps:
      - name: Finish workflow
        run: echo "All jobs completed successfully"
        