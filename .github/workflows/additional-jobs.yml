name: Additional Jobs

on:
  workflow_dispatch:

jobs:
  first_job:
    name: Run First Job
    runs-on: ubuntu-latest
    steps:
      - name: First step
        run: echo "First job is running"

      - name: Show information
        run: echo "This is the first task"

  second_job:
    name: Run Second Job
    runs-on: ubuntu-latest
    steps:
      - name: Second step
        run: echo "Second job is running"

      - name: Show result
        run: echo "This is the second task"
  
  third_job:
    name: Third Job - Python
    runs-on: ubuntu-latest
    steps:
      - name: Check Python
        run: python --version

      - name: Show Python message
        run: echo "Python environment is ready"

  fourth_job:
    name: Fourth Job - Final
    runs-on: ubuntu-latest
    steps:
      - name: Finish workflow
        run: echo "All jobs completed successfully"
        