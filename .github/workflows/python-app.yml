name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      name:
        description: "Enter your name"
        required: true
        default: "Executer"
  schedule:
    - cron: '30 7 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest pytest-cov

      - name: Run tests with coverage
        working-directory: OOP/testing/test_5/tests
        run: |
          pytest --cov=app --cov-report=xml:coverage.xml test_app.py -v

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./OOP/testing/test_5/tests/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
        

      - name: Run Python application
        run: |
          python -m py_compile ./OOP/testing/test_5/tests/app.py

      - name: Send greeting
        run: echo "Hello ${{ github.event.inputs.name }}"
        if: ${{ github.event.inputs.name != 'Executer' }}
