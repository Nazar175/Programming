[project]
name = "exam-variant-4-student-success-agent"
version = "0.1.0"
description = "Google ADK agent for tracking student performance"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
